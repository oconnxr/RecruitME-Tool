<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruiting Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1420; --panel: #141E2E; --panel-alt: #1A2740; --line: #28395A;
    --primary: #0033A1; --accent: #CC0022; --chalk: #F3F5F8; --chalk-dim: #8C9BB5;
    --good: #4C8B67; --warn: #E8A33D; --bad: #C1543F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--chalk); font: 14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  h1, h2, .eyebrow { font-family: Oswald, sans-serif; text-transform: uppercase; letter-spacing: .04em; margin: 0; }
  h1 { font-size: 26px; }
  h2 { font-size: 15px; color: var(--chalk-dim); margin-bottom: 10px; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-bottom: 18px; }
  .eyebrow { font-size: 12px; color: var(--chalk-dim); }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .grid > * { min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .panel + .panel { margin-top: 14px; }
  label { display: block; font-size: 12px; color: var(--chalk-dim); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--panel-alt); color: var(--chalk); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  textarea { min-height: 54px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel-alt); color: var(--chalk-dim); border-radius: 14px; padding: 4px 10px; cursor: pointer; font-size: 12px; user-select: none; }
  .chip.on { background: var(--primary); color: var(--chalk); border-color: var(--primary); }
  button { font: 600 13px Oswald, sans-serif; letter-spacing: .05em; text-transform: uppercase; border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer; color: var(--chalk); background: var(--accent); }
  button.secondary { background: var(--panel-alt); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  #log { max-height: 280px; overflow: auto; font: 12px/1.5 "IBM Plex Mono", monospace; color: var(--chalk-dim); white-space: pre-wrap; word-break: break-word; }
  #log .add { color: var(--good); } #log .err { color: var(--bad); } #log .note { color: var(--chalk); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .filters select, .filters input { width: auto; min-width: 110px; flex: 1 1 110px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font: 500 11px Oswald, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--chalk-dim); padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
  td { padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr.player { cursor: pointer; } tr.player:hover td { background: var(--panel-alt); }
  td.num { font-family: "IBM Plex Mono", monospace; text-align: right; }
  .score { font: 600 15px "IBM Plex Mono", monospace; }
  .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--primary); vertical-align: middle; margin-left: 6px; }
  .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--line); color: var(--chalk-dim); margin-right: 4px; }
  .tag.unc { border-color: var(--good); color: var(--good); }
  .tag.unk { border-color: var(--warn); color: var(--warn); }
  .tag.com { border-color: var(--bad); color: var(--bad); }
  tr.detail td { white-space: normal; background: var(--panel-alt); color: var(--chalk-dim); }
  tr.detail a { color: #7FA7FF; word-break: break-all; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; margin: 6px 0 10px; }
  .kv b { color: var(--chalk); font-weight: 500; }
  .empty { color: var(--chalk-dim); padding: 30px 0; text-align: center; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
  .summary { color: var(--chalk-dim); font-size: 12px; margin-bottom: 10px; }
  .summary b { color: var(--chalk); font-family: "IBM Plex Mono", monospace; }
  .prio { display: inline-block; min-width: 22px; text-align: center; font: 600 11px Oswald, sans-serif; border-radius: 4px; padding: 1px 6px; }
  .prio.A { background: var(--good); color: #fff; } .prio.B { background: var(--primary); color: #fff; }
  .prio.C { background: var(--panel-alt); color: var(--chalk-dim); border: 1px solid var(--line); }
  .prio.Pass { border: 1px solid var(--bad); color: var(--bad); }
  td.pick, th.pick { width: 28px; text-align: center; cursor: default; }
  input.pick { width: auto; accent-color: var(--accent); }
  .metric { font-family: "IBM Plex Mono", monospace; }
  .metric small { color: var(--chalk-dim); font-family: "IBM Plex Sans", sans-serif; margin-right: 4px; }
  #compare { display: none; margin-bottom: 14px; border: 1px solid var(--primary); border-radius: 8px; padding: 10px; background: var(--panel-alt); overflow-x: auto; }
  #compare.on { display: block; }
  #compare table td, #compare table th { white-space: nowrap; }
  #compare th { position: static; background: none; cursor: default; }
  .cards { display: none; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--panel-alt); cursor: pointer; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .name { font: 600 16px Oswald, sans-serif; letter-spacing: .03em; }
  .card .sub { color: var(--chalk-dim); font-size: 12px; margin: 2px 0 8px; }
  .card .metrics { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 8px; }
  .card .detail { margin-top: 10px; color: var(--chalk-dim); font-size: 13px; }
  .card .detail a { color: #7FA7FF; word-break: break-all; }
  @media (max-width: 700px) { .table-wrap { display: none; } .cards { display: block; } }
  .static-hide { } body.static .static-hide { display: none; } body.static .grid { grid-template-columns: 1fr; }
</style>
<!--BOARD-->
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="programName">Recruiting</div>
      <h1>Uncommitted Prospect Board</h1>
      <div class="eyebrow" id="lastUpdate" style="margin-top:4px"></div>
    </div>
    <div class="btns static-hide" style="margin:0">
      <a href="/api/export.csv"><button class="secondary" type="button">Export CSV</button></a>
    </div>
  </header>

  <div class="grid">
    <aside class="static-hide">
      <form class="panel" id="findForm">
        <h2>New search</h2>
        <label>Positions</label>
        <div class="chips" id="posChips"></div>
        <div class="row2">
          <div><label for="classes">Classes</label><input id="classes" placeholder="2027, 2028"></div>
          <div><label for="states">States</label><input id="states" placeholder="Default: OK, TX, AR, KS"></div>
        </div>
        <div class="row2">
          <div><label for="minFb">Min FB (mph)</label><input id="minFb" type="number" step="0.5" placeholder="86"></div>
          <div><label for="minEv">Min exit velo</label><input id="minEv" type="number" step="0.5" placeholder="92"></div>
        </div>
        <label for="count">How many players</label>
        <input id="count" type="number" min="1" max="60" value="20">
        <label for="notes">Other requirements</label>
        <textarea id="notes" placeholder="e.g. lefty bats, 3.3+ GPA, within 300 miles"></textarea>
        <div class="btns">
          <button type="submit" id="findBtn">Run search</button>
          <button type="button" class="secondary" id="verifyBtn">Re-check commitments</button>
        </div>
      </form>
      <div class="panel">
        <h2>Agent activity</h2>
        <div id="log"><span class="note">No search running.</span></div>
      </div>
    </aside>

    <section class="panel">
      <div class="filters">
        <select id="fClass"><option value="">All classes</option></select>
        <select id="fGroup">
          <option value="">All positions</option><option value="pitcher">Pitchers</option>
          <option value="catcher">Catchers</option><option value="infield">Infield</option><option value="outfield">Outfield</option>
        </select>
        <select id="fState"><option value="">All states</option></select>
        <select id="fStatus">
          <option value="open">Uncommitted + unknown</option><option value="uncommitted">Verified uncommitted</option>
          <option value="unknown">Needs verification</option><option value="all">Include committed</option>
        </select>
        <input id="fText" placeholder="Search name / school">
      </div>
      <div class="quick" id="quick"></div>
      <div class="summary" id="summary"></div>
      <div id="compare"></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const POSITIONS = ["RHP","LHP","C","1B","2B","SS","3B","MIF","OF"];
// Data source: embedded board (offline export), an external loader (the
// Google Sheets dashboard), or the local server's API.
const LOADER = window.__BOARD_LOADER__;
const STATIC = Array.isArray(window.__BOARD__) || typeof LOADER === "function";
if (STATIC) document.body.classList.add("static");

// ---- columns: a shared base plus metrics that fit the position group ----
const M = p => p.measurables ?? {}, S = p => p.stats ?? {};
const ops = p => (S(p).obp != null && S(p).slg != null) ? +(S(p).obp + S(p).slg).toFixed(3) : null;
const arm = p => M(p).ifVelo ?? M(p).ofVelo ?? M(p).cVelo;
const ht = p => M(p).heightIn ? `${Math.floor(M(p).heightIn / 12)}-${M(p).heightIn % 12}` : null;
const GROUP_COLS = {
  pitcher: [["FB", p => M(p).fbVelo, "num"], ["FB top", p => M(p).fbTopVelo, "num"], ["ERA", p => S(p).era, "num"], ["K/9", p => S(p).k9, "num"], ["Ht", ht]],
  catcher: [["Pop", p => M(p).popTime, "num"], ["C velo", p => M(p).cVelo, "num"], ["EV", p => M(p).exitVelo, "num"], ["OPS", ops, "num"]],
  infield: [["EV", p => M(p).exitVelo, "num"], ["60", p => M(p).sixty, "num"], ["IF velo", p => M(p).ifVelo, "num"], ["OPS", ops, "num"]],
  outfield: [["EV", p => M(p).exitVelo, "num"], ["60", p => M(p).sixty, "num"], ["OF velo", p => M(p).ofVelo, "num"], ["OPS", ops, "num"]],
};
// For a mixed list, show each player's two most telling numbers.
function keyMetrics(p) {
  const m = M(p), g = p.ranking.group, out = [];
  const add = (label, v) => { if (v != null) out.push([label, v]); };
  if (g === "pitcher") { add("FB top", m.fbTopVelo); add("FB", m.fbVelo); add("ERA", S(p).era); }
  else if (g === "catcher") { add("Pop", m.popTime); add("EV", m.exitVelo); add("C", m.cVelo); }
  else { add("EV", m.exitVelo); add("60", m.sixty); add("Arm", arm(p)); }
  return out.slice(0, 2);
}
const metricHtml = ([l, v]) => `<span class="metric"><small>${esc(l)}</small>${esc(v)}</span>`;
const BASE_START = [
  ["#", p => p.rank, "num"],
  ["Score", p => p.ranking.score, "score"],
  ["Name", p => p.name],
  ["Cls", p => p.gradYear, "num"],
  ["Pos", p => p.primaryPosition + (p.secondaryPosition ? "/" + p.secondaryPosition : "")],
  ["School", p => [p.highSchool, p.state].filter(Boolean).join(", ")],
];
const MIXED = [["Key numbers", p => keyMetrics(p)[0]?.[1], "keys"]];
const BASE_END = [
  ["Conf", p => p.ranking.confidence, "num"],
  ["Status", p => p.commitment?.status, "status"],
  ["Prio", p => p.staff?.priority, "prio"],
];
const colsFor = g => [...BASE_START, ...(GROUP_COLS[g] ?? MIXED), ...BASE_END];

// ---- quick filters ----
const QUICK = [
  ["fb90", "FB 90+", p => (M(p).fbTopVelo ?? M(p).fbVelo ?? 0) >= 90],
  ["prioA", "Priority A", p => p.staff?.priority === "A"],
  ["notContacted", "Not contacted", p => !p.staff?.contacted],
  ["hasData", "Has numbers", p => p.ranking.confidence > 0],
];
const quickOn = new Set();
$("quick").innerHTML = QUICK.map(([k, l]) => `<span class="chip" data-q="${k}">${l}</span>`).join("");
$("quick").onclick = e => {
  const k = e.target.dataset.q; if (!k) return;
  quickOn.has(k) ? quickOn.delete(k) : quickOn.add(k);
  e.target.classList.toggle("on");
  render();
};

let board = STATIC ? window.__BOARD__ : [];
let sort = { key: "Score", dir: -1 };
let open = null;
const picked = new Set();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";

$("posChips").innerHTML = POSITIONS.map(p => `<span class="chip" data-pos="${p}">${p}</span>`).join("");
$("posChips").onclick = e => e.target.dataset.pos && e.target.classList.toggle("on");

$("thead").onclick = e => {
  const key = e.target.dataset.key; if (!key) return;
  sort = { key, dir: sort.key === key ? -sort.dir : (["Name", "School", "Pos", "#"].includes(key) ? 1 : -1) };
  render();
};
["fClass","fGroup","fState","fStatus","fText"].forEach(id => $(id).addEventListener("input", render));

function fillSelect(id, values, label) {
  const cur = $(id).value;
  $(id).innerHTML = `<option value="">${label}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
  $(id).value = values.map(String).includes(cur) ? cur : "";
}
function statusTag(s) {
  const cls = { uncommitted: "unc", unknown: "unk", committed: "com" }[s] ?? "";
  return `<span class="tag ${cls}">${esc(s === "unknown" ? "verify" : s ?? "?")}</span>`;
}
const prioTag = v => v ? `<span class="prio ${esc(v)}">${esc(v)}</span>` : "";

function filtered() {
  const f = { cls: $("fClass").value, grp: $("fGroup").value, st: $("fState").value, status: $("fStatus").value, q: $("fText").value.toLowerCase() };
  const st = p => p.commitment?.status;
  return board.filter(p =>
    (!f.cls || String(p.gradYear) === f.cls) &&
    (!f.grp || p.ranking.group === f.grp) &&
    (!f.st || p.state === f.st) &&
    (f.status === "all" || (f.status === "open" ? st(p) !== "committed" : st(p) === f.status)) &&
    (!f.q || `${p.name} ${p.highSchool} ${p.travelTeam} ${p.city}`.toLowerCase().includes(f.q)) &&
    QUICK.every(([k, , fn]) => !quickOn.has(k) || fn(p)));
}

function render() {
  fillSelect("fClass", [...new Set(board.map(p => p.gradYear))].sort(), "All classes");
  fillSelect("fState", [...new Set(board.map(p => p.state).filter(Boolean))].sort(), "All states");
  const COLS = colsFor($("fGroup").value);
  if (!COLS.some(([h]) => h === sort.key)) sort = { key: "Score", dir: -1 };
  $("thead").innerHTML = `<th class="pick" title="Compare">⇄</th>` +
    COLS.map(([h]) => `<th data-key="${esc(h)}">${esc(h)}${sort.key === h ? (sort.dir < 0 ? " ▾" : " ▴") : ""}</th>`).join("");
  const rows = filtered();
  const get = COLS.find(([h]) => h === sort.key)[1];
  rows.sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null || x === "") return 1; if (y == null || y === "") return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sort.dir;
  });
  const unc = rows.filter(p => p.commitment?.status === "uncommitted").length;
  const unk = rows.filter(p => p.commitment?.status === "unknown").length;
  $("summary").innerHTML = `<b>${rows.length}</b> players · <b>${unc}</b> uncommitted · <b>${unk}</b> to verify` +
    (picked.size ? ` · <b>${picked.size}</b> picked to compare` : " · tick ⇄ on 2–4 players to compare");
  renderCompare();
  const span = COLS.length + 1;
  if (!rows.length) {
    const msg = board.length ? "No players match these filters." : "No players yet. Run a search to build the board.";
    $("tbody").innerHTML = `<tr><td colspan="${span}" class="empty">${msg}</td></tr>`;
    $("cards").innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  $("tbody").innerHTML = rows.map(p => {
    const cells = COLS.map(([h, fn, cls]) => {
      const v = fn(p);
      if (cls === "score") return `<td class="score">${v}<span class="bar" style="width:${Math.max(2, v * 0.6)}px"></span></td>`;
      if (cls === "status") return `<td>${statusTag(v)}</td>`;
      if (cls === "prio") return `<td>${prioTag(v)}</td>`;
      if (cls === "keys") return `<td>${keyMetrics(p).map(metricHtml).join(" &nbsp;") || "–"}</td>`;
      return `<td class="${cls ?? ""}">${v == null || v === "" ? "–" : esc(v)}</td>`;
    }).join("");
    const pick = `<td class="pick"><input type="checkbox" class="pick" data-pick="${esc(p.id)}"${picked.has(p.id) ? " checked" : ""}></td>`;
    const row = `<tr class="player" data-id="${esc(p.id)}">${pick}${cells}</tr>`;
    return open === p.id ? row + `<tr class="detail"><td colspan="${span}">${detail(p)}</td></tr>` : row;
  }).join("");
  $("cards").innerHTML = rows.map(p => `
    <div class="card" data-id="${esc(p.id)}">
      <div class="top"><span class="name">${p.rank ? `#${p.rank} ` : ""}${esc(p.name)}</span><span class="score">${p.ranking.score}</span></div>
      <div class="sub">${esc(p.primaryPosition)}${p.secondaryPosition ? "/" + esc(p.secondaryPosition) : ""} · ${esc(p.gradYear)} · ${esc([p.highSchool, p.state].filter(Boolean).join(", "))}</div>
      <div class="metrics">${keyMetrics(p).map(metricHtml).join("") || '<span class="metric"><small>No numbers yet</small></span>'}</div>
      <div>${statusTag(p.commitment?.status)} ${prioTag(p.staff?.priority)} ${p.staff?.contacted ? '<span class="tag unc">contacted</span>' : ""}</div>
      ${open === p.id ? `<div class="detail">${detail(p)}</div>` : ""}
    </div>`).join("");
}

function renderCompare() {
  const list = board.filter(p => picked.has(p.id));
  if (list.length < 2) { $("compare").classList.remove("on"); $("compare").innerHTML = ""; return; }
  const ROWS = [
    ["Score", p => p.ranking.score], ["Pos", p => p.primaryPosition + (p.secondaryPosition ? "/" + p.secondaryPosition : "")],
    ["School", p => [p.highSchool, p.state].filter(Boolean).join(", ")], ["Class", p => p.gradYear], ["Ht / Wt", p => [ht(p), M(p).weightLb].filter(Boolean).join(" / ")],
    ["FB", p => M(p).fbVelo], ["FB top", p => M(p).fbTopVelo], ["Exit velo", p => M(p).exitVelo], ["60", p => M(p).sixty],
    ["Arm", arm], ["Pop", p => M(p).popTime], ["ERA", p => S(p).era], ["K/9", p => S(p).k9], ["OPS", ops],
    ["Confidence", p => p.ranking.confidence + "%"], ["Status", p => p.commitment?.status], ["Priority", p => p.staff?.priority], ["Coach", p => p.staff?.coach],
  ];
  const show = ROWS.filter(([, fn]) => list.some(p => fn(p) != null && fn(p) !== ""));
  $("compare").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h2 style="margin:0">Compare</h2><button type="button" class="secondary" id="clearPick">Clear</button></div>
    <table><thead><tr><th></th>${list.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr></thead>
    <tbody>${show.map(([l, fn]) => `<tr><td style="color:var(--chalk-dim)">${l}</td>${list.map(p => `<td class="num">${fn(p) == null || fn(p) === "" ? "–" : esc(fn(p))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  $("compare").classList.add("on");
  $("clearPick").onclick = () => { picked.clear(); render(); };
}

function detail(p) {
  const m = M(p), s = S(p), c = p.commitment ?? {}, st = p.staff ?? {};
  const kv = (k, v) => v == null || v === "" ? "" : `<div>${k}: <b>${esc(v)}</b></div>`;
  return `
    <div class="kv">
      ${kv("Height", ht(p))}${kv("Weight", m.weightLb)}${kv("FB", m.fbVelo)}${kv("FB top", m.fbTopVelo)}${kv("Exit velo", m.exitVelo)}${kv("60", m.sixty)}
      ${kv("IF velo", m.ifVelo)}${kv("OF velo", m.ofVelo)}${kv("C velo", m.cVelo)}${kv("Pop", m.popTime)}
      ${kv("Measured", m.measuredAt)}${kv("Travel team", p.travelTeam)}${kv("Hometown", p.city)}
      ${kv("Stats", s.season)}${kv("AB", s.atBats)}${kv("AVG", s.avg)}${kv("OBP", s.obp)}${kv("SLG", s.slg)}${kv("HR", s.hr)}${kv("SB", s.sb)}
      ${kv("IP", s.inningsPitched)}${kv("ERA", s.era)}${kv("K/9", s.k9)}${kv("BB/9", s.bb9)}${kv("WHIP", s.whip)}
    </div>
    ${(st.priority || st.coach || st.nextStep || st.notes || st.contacted) ? `<div class="kv">
      ${kv("Priority", st.priority)}${kv("Contacted", st.contacted ? "Yes" : null)}${kv("Assigned coach", st.coach)}${kv("Next step", st.nextStep)}
    </div>${st.notes ? `<p><b>Coach notes:</b> ${esc(st.notes)}</p>` : ""}` : ""}
    ${p.ranking.flags.length ? `<div>${p.ranking.flags.map(f => `<span class="tag unk">${esc(f)}</span>`).join("")}</div>` : ""}
    ${p.scoutingNotes ? `<p><b>Notes:</b> ${esc(p.scoutingNotes)}</p>` : ""}
    <p><b>Commitment:</b> ${statusTag(c.status)} ${esc(c.school ?? "")} ${esc(c.evidence ?? "")}
      ${c.checkedUrl ? ` <a href="${esc(safeUrl(c.checkedUrl))}" target="_blank" rel="noopener">source</a>` : ""}
      ${c.verifiedAt ? ` (checked ${esc(c.verifiedAt.slice(0, 10))})` : ""}</p>
    <p><b>Sources:</b> ${(p.sources ?? []).map(u => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${esc(u)}</a>`).join("<br>")}</p>`;
}

function onPick(e) {
  const id = e.target.dataset?.pick; if (!id) return false;
  if (e.target.checked) { if (picked.size >= 4) { e.target.checked = false; return true; } picked.add(id); } else picked.delete(id);
  render();
  return true;
}
$("tbody").onclick = e => {
  if (e.target.closest("td.pick")) { onPick(e); return; }
  if (e.target.closest("a")) return;
  const tr = e.target.closest("tr.player"); if (!tr) return;
  open = open === tr.dataset.id ? null : tr.dataset.id;
  render();
};
$("cards").onclick = e => {
  if (e.target.closest("a")) return;
  const card = e.target.closest(".card"); if (!card) return;
  open = open === card.dataset.id ? null : card.dataset.id;
  render();
};

async function load() {
  const r = await fetch("/api/board").then(r => r.json());
  board = r.prospects;
  $("programName").textContent = `${r.program.name} · Recruiting`;
  setRunning(r.job && !r.job.done);
  render();
}

// ---- live agent activity ----
function log(text, cls = "") {
  const el = document.createElement("div");
  el.className = cls; el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
}
function setRunning(on) { $("findBtn").disabled = on; $("verifyBtn").disabled = on; }

function listen() {
  const es = new EventSource("/api/events");
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.type === "start") { $("log").innerHTML = ""; setRunning(true); log(e.verifying ? `Re-checking ${e.verifying} players...` : "Search started.", "note"); }
    else if (e.type === "search") log(`search  ${e.query}`);
    else if (e.type === "fetch") log(`fetch   ${e.url}`);
    else if (e.type === "text") log(e.text, "note");
    else if (e.type === "info") log(e.text, "err");
    else if (e.type === "error") log(`Error: ${e.text}`, "err");
    else if (e.type === "prospect") { log(`+ ${e.prospect.name} (${e.prospect.gradYear} ${e.prospect.primaryPosition}, ${e.prospect.state ?? "?"}) [${e.prospect.commitment.status}]`, "add"); load(); }
    else if (e.type === "commitment") { log(`= ${e.name}: ${e.from} -> ${e.to}${e.school ? " (" + e.school + ")" : ""}`, "add"); load(); }
    else if (e.type === "done") { log(e.checked != null ? `Done. Checked ${e.checked}, ${e.changed ?? 0} changed.` : `Done. ${e.added} added, ${e.updated} updated.${e.summary ? "\n" + e.summary : ""}`, "note"); }
    else if (e.type === "jobEnd") { setRunning(false); load(); }
  };
}

const list = s => s.split(",").map(x => x.trim()).filter(Boolean);
$("findForm").onsubmit = async e => {
  e.preventDefault();
  const body = {
    positions: [...document.querySelectorAll("#posChips .on")].map(c => c.dataset.pos),
    gradYears: list($("classes").value).map(Number).filter(Boolean),
    states: list($("states").value),
    minFbVelo: Number($("minFb").value) || undefined,
    minExitVelo: Number($("minEv").value) || undefined,
    count: Number($("count").value) || undefined,
    notes: $("notes").value.trim() || undefined,
  };
  const r = await fetch("/api/find", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) log((await r.json()).error, "err");
};
$("verifyBtn").onclick = async () => {
  const r = await fetch("/api/verify", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
  if (!r.ok) log((await r.json()).error, "err");
};

if (LOADER) {
  $("tbody").innerHTML = `<tr><td colspan="20" class="empty">Loading players...</td></tr>`;
  LOADER().then(r => {
    board = r.prospects;
    if (r.programName) $("programName").textContent = `${r.programName} · Recruiting`;
    if (r.lastUpdate) $("lastUpdate").textContent = r.lastUpdate;
    render();
  }).catch(err => { $("tbody").innerHTML = `<tr><td colspan="20" class="empty">Could not load the Sheet: ${esc(err?.message ?? err)}</td></tr>`; });
} else if (STATIC) render(); else { load(); listen(); }
</script>
</body>
</html>
